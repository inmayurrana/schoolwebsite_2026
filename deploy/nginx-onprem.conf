# ==============================================================================
# Nginx Configuration for Cambridge International School, Mandi
# Optimized for On-Premise Low-Resource Servers (RAM / CPU Caching)
# ==============================================================================

# Rate Limiting Zone to prevent server overload
limit_req_zone $binary_remote_addr zone=school_limit:10m rate=15r/s;

server {
    listen 80;
    server_name cismandi.edu.in www.cismandi.edu.in localhost;

    # Gzip Compression for low-bandwidth Himalayan internet
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Max upload size for PDFs and media
    client_max_body_size 25M;

    # Direct static caching for Next.js assets (Bypasses Node.js to save CPU/RAM)
    location /_next/static/ {
        alias /var/www/cismandi/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Direct static serving of uploads folder
    location /uploads/ {
        alias /var/www/cismandi/public/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Direct static serving of sample documents
    location /sample-documents/ {
        alias /var/www/cismandi/public/sample-documents/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Proxy all dynamic requests to Next.js process
    location / {
        limit_req zone=school_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
